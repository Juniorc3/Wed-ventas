<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="coco" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="0.5" stop-color="#78350f"/>
      <stop offset="1" stop-color="#3f1c06"/>
    </radialGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Hojas de palmera saliendo por detrás del coco -->
  <g transform="translate(256 256)">
    <path d="M -10 -105 Q 10 -200 75 -215 Q 40 -180 35 -115 Z" fill="url(#hoja)"/>
    <path d="M 10 -105 Q -10 -200 -75 -215 Q -40 -180 -35 -115 Z" fill="url(#hoja)"/>
  </g>

  <!-- Coco -->
  <g transform="translate(256 290)">
    <circle cx="0" cy="0" r="135" fill="url(#coco)"/>

    <!-- Fibras / textura -->
    <path d="M -105 -50 Q -85 -70 -60 -55" stroke="#451a03" stroke-width="7" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M 60 -85 Q 85 -100 105 -85" stroke="#451a03" stroke-width="7" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M -95 45 Q -75 35 -50 50" stroke="#451a03" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 75 55 Q 95 45 110 60" stroke="#451a03" stroke-width="7" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M 0 95 Q 15 105 10 115" stroke="#451a03" stroke-width="7" fill="none" opacity="0.4" stroke-linecap="round"/>

    <!-- Los 3 ojos del coco -->
    <ellipse cx="-32" cy="-22" rx="19" ry="21" fill="#0c0500"/>
    <ellipse cx="32" cy="-22" rx="19" ry="21" fill="#0c0500"/>
    <ellipse cx="0" cy="24" rx="19" ry="21" fill="#0c0500"/>

    <!-- Brillo -->
    <ellipse cx="-62" cy="-72" rx="32" ry="18" fill="#fef3c7" opacity="0.22" transform="rotate(-25 -62 -72)"/>
  </g>
</svg>
